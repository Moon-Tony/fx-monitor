name: fx-monitor

# cron은 UTC 기준입니다. 한국시간 월 08:00(= 일 23:00 UTC) ~ 토 06:00(= 금 21:00 UTC) 구간을 15분마다 실행합니다.
on:
  schedule:
    - cron: "*/15 23 * * 0"
    - cron: "*/15 * * * 1-4"
    - cron: "*/15 0-20 * * 5"
    - cron: "0 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-monitor

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 상태 저장
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
