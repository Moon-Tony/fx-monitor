name: backtest

# 직접 "Run workflow" 버튼을 눌렀을 때만 실행됩니다 (자동 실행 없음)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt
      - run: python backtest.py
      - name: 결과 저장
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add backtest_results
          git diff --staged --quiet || (git commit -m "backtest results" && git pull --rebase && git push)
